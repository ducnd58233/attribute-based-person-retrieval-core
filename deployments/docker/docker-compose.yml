# Local smoke test for a submission zip, before it goes to Codabench.
#
# Mirrors the two constraints that actually bite: no network access, and a
# submission folder laid out the way the ingestion program hands it to run.py
# (see PROBLEM-DETAILS.md, Submission page). Passing here is necessary, not
# sufficient.
#
# Usage (from the repo root, after `conda activate wacv`):
#   docker compose -f deployments/docker/docker-compose.yml run --rm submission-test
#
# Full rank_gallery smoke (Codabench-shaped Q/G; any packaged model):
#   SUBMISSION_DIR=../../build/<pkg> DATA_DIR=../../data \
#     HARNESS_N_GALLERY=2048 HARNESS_N_QUERIES=512 \
#     docker compose -f deployments/docker/docker-compose.yml run --rm submission-rank-smoke
#
# Point SUBMISSION_DIR at the folder you're about to zip (default:
# ../../build/submission), either via a .env next to this file or exported
# in your shell.

services:
  submission-test:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    network_mode: none
    working_dir: /app
    volumes:
      - ${SUBMISSION_DIR:-../../build/submission}:/app:ro
    command: ["-c", "import run; run.load_model()"]

  submission-rank-smoke:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    network_mode: none
    working_dir: /app
    environment:
      HARNESS_N_GALLERY: ${HARNESS_N_GALLERY:-33407}
      HARNESS_N_QUERIES: ${HARNESS_N_QUERIES:-3462}
      # Empty string forces CPU in the eval image (needed on hosts whose GPU
      # is newer than torch 2.4.1's sm_* list). Unset to let run.py probe CUDA.
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES-}
    volumes:
      - ${SUBMISSION_DIR:-../../build/submission}:/app:ro
      - ${DATA_DIR:-../../data}:/data:ro
      - ../../scripts/submission-rank-smoke.py:/harness.py:ro
    command: ["/harness.py"]

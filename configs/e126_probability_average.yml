# E126 H126 — eval-only member config for the E107 + E112 identity probability
# average (both ViT-L/14 teacher recipe, clean stretch Resize at eval). Train
# fields mirror E107 and are unused here. Weights fixed 0.5/0.5 on the CLI.

model:
  name: clip_vit_l14
  pretrained: true
  dropout: 0.1
  freeze_backbone: true
  lora_rank: 16
  lora_alpha: 16.0

data:
  root: data
  batch_size: 8
  num_workers: 0
  limit: null
  train_augmentation: true
  image_size: [224, 112]
  train_domains:
    - PA100k
    - PETA
  degrade_aug:
    enabled: true
    downscale: [0.3, 1.0]
    blur_p: 0.3
    jpeg: [30, 90]

optimization:
  epochs: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: false

run:
  name: e126_probability_average
  output_dir: runs
  resume: true
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
  tta_scale: 1.15

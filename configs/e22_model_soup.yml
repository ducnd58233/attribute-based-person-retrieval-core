# E22 greedy model soup (H22 / Wortsman ICML 2022).
#
# Evaluate / package a souped DINOv2 checkpoint (not for training).
# Ingredients: E20 seed42 + E20s2 seed43 + E20s3 seed44 (same LP-FT recipe).
#
# Build (from attribute-based-person-retrieval-core-e22 worktree):
#
#   .venv/bin/python scripts/soup.py \
#     --mode greedy \
#     --checkpoints \
#       ../attribute-based-person-retrieval-core-e20/runs/e20_dinov2_lpft/checkpoints/best.pt \
#       ../attribute-based-person-retrieval-core-e20s2/runs/e20_dinov2_seed43/checkpoints/best.pt \
#       ../attribute-based-person-retrieval-core-e20s3/runs/e20_dinov2_seed44/checkpoints/best.pt \
#     --metrics runs/e22_model_soup/ingredient_metrics.json \
#     --config configs/e22_model_soup.yml \
#     --out runs/e22_model_soup/checkpoints/soup.pt
#
# Then:
#   .venv/bin/python scripts/evaluate.py \
#     --config configs/e22_model_soup.yml \
#     --checkpoint runs/e22_model_soup/checkpoints/soup.pt \
#     --protocol both

model:
  name: dinov2_vitb14_reg
  pretrained: true
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true
  image_size: [252, 126]
  train_domains:
    - PA100k
    - PETA

optimization:
  epochs: 1
  learning_rate: 0.00001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 1

run:
  name: e22_model_soup
  output_dir: runs
  resume: false
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
    - hflip
    - scale_crop
  tta_scale: 1.15

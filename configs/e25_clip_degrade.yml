# E25: CLIP-B/16 LP-FT (E17 recipe) + E13 surveillance degrade-aug.
# Control: E17 S* LODO-M mADM 0.6957 / ID-val 0.7130.
# H25: promote if LODO-M mADM >= E17 + 0.01 and ID-val drop <= 0.01.

model:
  name: clip_vit_b16
  pretrained: true
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true
  train_domains:
    - PA100k
    - PETA
  degrade_aug:
    enabled: true
    downscale: [0.3, 1.0]
    blur_p: 0.3
    jpeg: [30, 90]

optimization:
  epochs: 8
  learning_rate: 0.00001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: true
  lp_epochs: 2
  lp_learning_rate: 0.001
  layer_decay: 0.65

run:
  name: e25_clip_degrade
  output_dir: runs
  resume: false
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
    - hflip
    - scale_crop
  tta_scale: 1.15

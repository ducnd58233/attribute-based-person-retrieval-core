# E48: ConvNeXt C-full + S* (hybrid NLL/L1 + dual softmax), identity TTA only.
# Checkpoint: runs/convnext-baseline/best.pt (C-full ImageNet ConvNeXt-B).
# Purpose: decompose the +0.106 test jump (946021 Specker → 952507 CLIP+S*).

model:
  name: convnext_base
  pretrained: false
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true

optimization:
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.01

run:
  name: e48_convnext_sstar
  output_dir: runs
  resume: false
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
  tta_scale: 1.15

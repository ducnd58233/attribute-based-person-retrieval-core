model:
  name: convnext_base
  pretrained: true
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true
  train_domains: [PA100k, PETA]

optimization:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  weight_avg: swad
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 3
  label_smoothing: 0.05
  early_stop_patience: 4
  swad:
    loss_tolerance: 0.01

run:
  name: e14_swad
  output_dir: runs
  resume: true
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.5
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
    - hflip
    - scale_crop
  tta_scale: 1.15

# E75 / H78 — CMA-ES layer-group merge fitness config (identity TTA, S*).
# Members are organizer-trained CLIP B/16 checkpoints; no extra PAR data.
model:
  name: clip_vit_b16
  pretrained: false
  dropout: 0.1

data:
  root: data
  batch_size: 48
  num_workers: 4
  limit: null
  train_augmentation: false
  train_domains:
    - PA100k
    - PETA
  eval_domains:
    - PA100k
    - PETA
    - Market1501

optimization:
  epochs: 1
  learning_rate: 0.00001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: false

run:
  name: e75_cma_merge
  output_dir: runs
  resume: false
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
  tta_scale: 1.15

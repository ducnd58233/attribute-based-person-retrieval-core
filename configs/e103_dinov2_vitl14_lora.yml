# E103: DINOv2 ViT-L/14-reg member, the CLIP-L recipe on a DINOv2 tower: frozen,
# LoRA rank 16 on every attn.proj, 252x126, batch 8, 8 epochs, PA100k + PETA.
# One of the nine members of the final entry (Codabench 995287); see REPRODUCE.md.
# This config and its model builder were rewritten after the originals were lost;
# the model it builds has the same state-dict keys and shapes as the shipped E103
# weights, loads them strictly and gives the same logits. Checkpoint selection
# used three views (below); the final package runs this member on the original
# view only.
# Backbone: DINOv2 (Apache-2.0 code, Meta weights), not trained for pedestrian attributes.

model:
  name: dinov2_vitl14_reg
  pretrained: true
  dropout: 0.1
  freeze_backbone: true
  lora_rank: 16
  lora_alpha: 16.0

data:
  root: data
  batch_size: 8
  num_workers: 4
  limit: null
  train_augmentation: true
  image_size: [252, 126]
  train_domains:
    - PA100k
    - PETA

optimization:
  epochs: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: false

run:
  name: e103_dinov2_vitl14_lora
  output_dir: runs
  resume: true
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
    - hflip
    - scale_crop
  tta_scale: 1.15

# E74b: latent kNN smoothing with a cosine gate, evaluated on E17's checkpoint.
# Packaging enables the same block by default for CLIP/DINOv2 packages.
model:
  name: clip_vit_b16
  pretrained: false
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null

run:
  name: e74b_gated_smoothing
  output_dir: runs
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05
  neighbour_smooth:
    k: 5
    beta: 0.7
    min_similarity: 0.95

inference:
  tta:
    - identity

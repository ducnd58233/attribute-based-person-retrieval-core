# E20 / H20: DINOv2 ViT-B/14 (registers) LP-FT vs C-lodo on LODO-M.
# S* ranking (hybrid + dual_softmax) and LP-FT schedule mirror e17_clip_b16_lpft.
#
# Weights: leave model.pretrained true for torch.hub download, or set
# model.weights_path to a vendored dinov2_vitb14_reg4_pretrain.pth (see
# src/wacv/models/dinov2.py module docstring for hub / local / HF options).
#
# 50/50 probability average with C-lodo (after both checkpoints exist):
#   uv run python scripts/evaluate.py --config configs/e20_dinov2_lpft.yml \
#     --checkpoint runs/e20_dinov2_lpft/checkpoints/best.pt \
#     --ensemble-config configs/e01_lodo_control.yml \
#     --ensemble-checkpoint runs/e01_lodo_control/checkpoints/best.pt \
#     --ensemble-weight 0.5 --protocol lodo_m

model:
  name: dinov2_vitb14_reg
  pretrained: true
  dropout: 0.1
  # weights_path: data/pretrained/dinov2_vitb14_reg4_pretrain.pth

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true
  image_size: [252, 126]
  train_domains:
    - PA100k
    - PETA

optimization:
  epochs: 8
  learning_rate: 0.00001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: true
  lp_epochs: 2
  lp_learning_rate: 0.001
  layer_decay: 0.65

run:
  name: e20_dinov2_lpft
  output_dir: runs
  resume: false
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
    - hflip
    - scale_crop
  tta_scale: 1.15

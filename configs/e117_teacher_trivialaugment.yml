# E117: CLIP ViT-L/14 member with TrivialAugmentWide.
# One of the nine members of the final entry (Codabench 995287); see REPRODUCE.md.
# Base CLIP-L recipe: frozen CLIP ViT-L/14 at 224x112, LoRA rank 16 on the attention
# out_proj, AdamW 1e-4, batch 8, 8 epochs, EMA 0.999, PA100k + PETA of the
# organizer train split. Train pipeline: Resize, AugMix, flip, ColorJitter 0.2,
# Normalize, RandomErasing p=0.25. Evaluation uses Resize and Normalize only.
# Change: TrivialAugmentWide replaces AugMix.
# Backbone: OpenAI CLIP ViT-L/14 (MIT), not trained for pedestrian attributes.

model:
  name: clip_vit_l14
  pretrained: true
  dropout: 0.1
  freeze_backbone: true
  lora_rank: 16
  lora_alpha: 16.0

data:
  root: data
  batch_size: 8
  num_workers: 0
  limit: null
  train_augmentation: true
  image_size: [224, 112]
  train_domains:
    - PA100k
    - PETA
  trivial_augment:
    enabled: true

optimization:
  epochs: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: false

run:
  name: e117_teacher_trivialaugment
  output_dir: runs
  resume: true
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
  tta_scale: 1.15

model:
  name: convnext_base
  pretrained: true
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true

optimization:
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.01

run:
  name: e04_group_categorical
  output_dir: runs
  resume: false
  seed: 42
  device: auto
  progress: true

ranking:
  distance: group_categorical
  temperature: 1.0
  group_mode: categorical

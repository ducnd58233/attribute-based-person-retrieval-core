# E20s3 / H22 ingredient: DINOv2 ViT-B/14-reg LP-FT seed 44 (same recipe as E20).
# Control ingredient: E20 seed 42 LODO-M mADM 0.7188.

model:
  name: dinov2_vitb14_reg
  pretrained: true
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true
  image_size: [252, 126]
  train_domains:
    - PA100k
    - PETA

optimization:
  epochs: 8
  learning_rate: 0.00001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: true
  lp_epochs: 2
  lp_learning_rate: 0.001
  layer_decay: 0.65

run:
  name: e20_dinov2_seed44
  output_dir: runs
  resume: false
  seed: 44
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
    - hflip
    - scale_crop
  tta_scale: 1.15

# Local train override for E25: same recipe as e25_clip_degrade.yml but
# identity-only TTA during per-epoch ranking (avoids silent OOM/TDR on laptop
# GPU after LP epoch-1 validate). Final H25 verdict uses full S* evaluate.py.

model:
  name: clip_vit_b16
  pretrained: true
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true
  train_domains:
    - PA100k
    - PETA
  degrade_aug:
    enabled: true
    downscale: [0.3, 1.0]
    blur_p: 0.3
    jpeg: [30, 90]

optimization:
  epochs: 8
  learning_rate: 0.00001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: true
  lp_epochs: 2
  lp_learning_rate: 0.001
  layer_decay: 0.65

run:
  name: e25_clip_degrade
  output_dir: runs
  resume: false
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05

inference:
  tta:
    - identity
  tta_scale: 1.15

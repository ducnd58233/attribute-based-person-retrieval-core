model:
  name: convnext_base
  pretrained: true
  dropout: 0.1

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true

optimization:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 3
  label_smoothing: 0.05

ranking:
  distance: specker
  temperature: 1.5

run:
  name: specker-distance
  output_dir: runs
  resume: true
  seed: 42
  device: auto
  progress: true

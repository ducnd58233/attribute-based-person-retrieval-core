# E26: CLIP-B/16 LP-FT (E17) + E15 ASMR aux (requires hard_query_adapter).
# Control: E17 S* LODO-M Rank-1 0.3640 / mAP 0.2829 / mADM 0.6957.
# H26: promote if LODO-M R1 and mAP both >= E17 + 0.01 without mADM drop.

model:
  name: clip_vit_b16
  pretrained: true
  dropout: 0.1
  hard_query_adapter: true
  adapter_dim: 256

data:
  root: data
  batch_size: 32
  num_workers: 4
  limit: null
  train_augmentation: true
  train_domains:
    - PA100k
    - PETA

losses:
  asmr_aux:
    weight: 0.3

optimization:
  epochs: 8
  learning_rate: 0.00001
  weight_decay: 0.01
  pos_weight_clip: 10.0
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  scheduler_factor: 0.1
  scheduler_patience: 2
  label_smoothing: 0.05
  early_stop_patience: 4
  lp_ft: true
  lp_epochs: 2
  lp_learning_rate: 0.001
  layer_decay: 0.65

run:
  name: e26_clip_asmr
  output_dir: runs
  resume: false
  seed: 42
  device: auto
  progress: true

ranking:
  distance: hybrid
  temperature: 1.0
  alpha: 0.5
  query_norm: dual_softmax
  query_norm_tau: 0.05
  clear_fusion: 0.5

inference:
  tta:
    - identity
    - hflip
    - scale_crop
  tta_scale: 1.15
